# ~/.tmux.conf - Minimal High-Productivity Tmux Config

# ============================================================================
# BASIC SETTINGS
# ============================================================================

# Use C-a as prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 50000

# Reduce escape time
set -sg escape-time 0

# Enable 256 colors
set -g default-terminal "screen-256color"

# ============================================================================
# CORE KEYBINDINGS
# ============================================================================

# Quick reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# WINDOW NAVIGATION - j for previous, k for next
bind j previous-window
bind k next-window

# WINDOW MANAGEMENT
bind c new-window -c "#{pane_current_path}"

# PANE MANAGEMENT
# Default splitting (% for horizontal, " for vertical)
# Use default tmux split bindings

# Vim-like pane navigation
bind h select-pane -L
bind l select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Kill pane/window
bind x kill-pane
bind X kill-window

# SESSION MANAGEMENT
bind s choose-session

# COPY MODE
bind v copy-mode
setw -g mode-keys vi

# ============================================================================
# VISUAL STYLING (All White Text)
# ============================================================================

# Status bar
set -g status-bg colour235
set -g status-fg white
set -g status-left '#[fg=white,bold][#S] '
set -g status-right '#[fg=white,bold]%H:%M'

# Window status
setw -g window-status-format '#[fg=white] #I:#W '
setw -g window-status-current-format '#[fg=colour10,bold] #I:#W '

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=white

# Message styling
set -g message-style bg=colour235,fg=white,bold
